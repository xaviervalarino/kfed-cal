<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KFED CAL — desktop list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Creepster&amp;family=Pirata+One&amp;family=Courier+Prime:wght@400;700&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ece6d6}a:hover{color:#ffffff}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 1100px; box-sizing: border-box; overflow: hidden; background: #0b0b0b; color: #ece6d6; font-family: 'Courier Prime', monospace; padding: 40px">
  <footer style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 40px; border-top: 1px solid #34302c; background: #0b0b0b; font-size: 13px; color: #b98e98">
    <span>KFED CAL · 21 LA venues, scraped weekly</span>
    <a href="Status.dc.html" style="font-weight: 700; letter-spacing: 0.1em; color: #f4cdd5">SCRAPE STATUS →</a>
  </footer>
  <div style="max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column">

    <header style="display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 32px">
      <a href="Main.dc.html" aria-label="KFED CAL calendar" style="text-decoration: none; color: inherit"><h1 style="margin: 0; font-family: 'Creepster', cursive; font-weight: 400; font-size: 120px; line-height: 1; letter-spacing: 0.02em; color: #ece6d6; text-shadow: 3px 2px 0 #ff3b3b">KFED CAL</h1></a>
      <a href="Status.dc.html" style="font-weight: 700; font-size: 12px; letter-spacing: 0.2em; color: #f4cdd5; text-decoration: underline; text-underline-offset: 4px">UPDATED WED OCT 28</a>
    </header>

    <div style="display: flex; justify-content: space-between; align-items: center; gap: 24px; border-top: 1px solid #34302c; border-bottom: 1px solid #34302c; padding: 12px 0; margin-bottom: 24px">
      <div style="display: flex; align-items: center; gap: 8px">
        <button style="font-family: 'Courier Prime', monospace; font-weight: 700; font-size: 13px; letter-spacing: 0.1em; background: #b98e98; color: #0b0b0b; border: 1px solid #b98e98; height: 44px; padding: 0 14px">TONIGHT</button>
        <button style="font-family: 'Courier Prime', monospace; font-weight: 700; font-size: 13px; letter-spacing: 0.1em; background: transparent; color: #ece6d6; border: 1px solid #b98e98; height: 44px; padding: 0 14px">WEEKEND</button>
        <button style="font-family: 'Courier Prime', monospace; font-weight: 700; font-size: 13px; letter-spacing: 0.1em; background: transparent; color: #ece6d6; border: 1px solid #b98e98; height: 44px; padding: 0 14px">NEXT 7 DAYS</button>
      </div>
      <div style="display: flex; align-items: center; gap: 24px">
        <button style="font-family: 'Courier Prime', monospace; font-weight: 700; font-size: 13px; letter-spacing: 0.1em; background: transparent; color: #ece6d6; border: 1px solid #b98e98; height: 44px; padding: 0 14px">VENUES ▾</button>
        <input aria-label="Search bands" placeholder="search a band…" style="width: 200px; font-family: 'Courier Prime', monospace; font-size: 15px; background: transparent; color: #ece6d6; border: 0; border-bottom: 2px solid #ece6d6; padding: 8px 2px">
        <div style="display: flex; border: 1px solid #b98e98">
          <button style="font-family: 'Courier Prime', monospace; font-weight: 700; font-size: 13px; letter-spacing: 0.1em; background: #b98e98; color: #0b0b0b; border: 0; height: 42px; padding: 0 14px">LIST</button>
          <button style="font-family: 'Courier Prime', monospace; font-weight: 700; font-size: 13px; letter-spacing: 0.1em; background: transparent; color: #ece6d6; border: 0; height: 42px; padding: 0 14px">WEEK</button>
          <button style="font-family: 'Courier Prime', monospace; font-weight: 700; font-size: 13px; letter-spacing: 0.1em; background: transparent; color: #ece6d6; border: 0; height: 42px; padding: 0 14px">MONTH</button>
        </div>
      </div>
    </div>

    <sc-for list="{{days}}" as="day" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; margin-bottom: 24px">
        <div style="display: flex; align-items: baseline; gap: 16px; padding-bottom: 8px; border-bottom: 2px solid #ece6d6">
          <span style="font-family: 'Pirata One', cursive; font-size: 44px; line-height: 1">{{day.date}}</span>
          <span style="font-weight: 700; font-size: 12px; letter-spacing: 0.2em; color: #f4cdd5">{{day.label}}</span>
        </div>
        <sc-for list="{{day.events}}" as="e" hint-placeholder-count="5">
          <a href="#" style="display: grid; grid-template-columns: 80px minmax(0, 1fr) 200px 96px; gap: 16px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid #34302c; text-decoration: none; color: #ece6d6">
            <span style="font-weight: 700; font-size: 14px; color: #ff3b3b">{{e.t}}</span>
            <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
              <span style="{{e.band}}">{{e.h}}</span>
              <sc-if value="{{e.s}}" hint-placeholder-val="{{true}}">
                <span style="font-size: 14px; line-height: 1.35; color: #b98e98">{{e.s}}</span>
              </sc-if>
            </span>
            <span style="font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #f4cdd5">{{e.v}}</span>
            <span style="justify-self: end">
              <sc-if value="{{e.sold}}" hint-placeholder-val="{{false}}">
                <span style="font-weight: 700; font-size: 11px; letter-spacing: 0.12em; background: #ff3b3b; color: #0b0b0b; padding: 2px 6px">SOLD OUT</span>
              </sc-if>
              <sc-if value="{{e.p}}" hint-placeholder-val="{{true}}">
                <span style="font-size: 14px; color: #b98e98">{{e.p}}</span>
              </sc-if>
            </span>
          </a>
        </sc-for>
      </section>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const band = (e) => "font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; line-height: 1.05; color: " + (e.sold ? '#b98e98' : '#ece6d6') + ';';
    const days = [
      { date: 'October 30', label: 'FRIDAY · TONIGHT', events: [
        { t: '7PM', h: 'The Tubs', s: 'w/ Touch Girl Apple Blossom', v: 'Zebulon', p: '$27' },
        { t: '7PM', h: 'Francis of Delirium', s: 'w/ Beatrix', v: 'The Echo' },
        { t: '7PM', h: 'Failure', s: 'The Rising Skyline Tour', v: 'The Belasco' },
        { t: '7PM', h: 'Daði Freyr', s: '', v: 'The Wiltern' },
        { t: '8PM', h: 'Club Nevermore', s: '3rd annual Halloween · bands + DJs + performances', v: 'Monty Bar', p: '$5–10' },
        { t: '10PM', h: 'Kulture Klub', s: "The '80s Dance Party", v: 'Zebulon', p: 'free' }
      ] },
      { date: 'October 31', label: 'SATURDAY · HALLOWEEN', events: [
        { t: '6:30PM', h: 'WØM Halloween Cover Show', s: 'Annual · to benefit Selah', v: 'Zebulon', p: '$20' },
        { t: '7PM', h: 'Marilyn Manson', s: 'Live in Los Angeles', v: 'The Wiltern' },
        { t: '9PM', h: 'Danse-X', s: 'Goth // wave // italo · Mark Label + Unholy + guest Void Palace', v: 'Monty Bar', p: '$10 after 11' }
      ] }
    ];
    return {
      days: days.map((d) => ({ ...d, events: d.events.map((e) => ({ ...e, band: band(e) })) }))
    };
  }
}
</script>
</body>
</html>
