<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KFED CAL — phone filters</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Creepster&amp;family=Pirata+One&amp;family=Courier+Prime:wght@400;700&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ece6d6}a:hover{color:#ffffff}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1100px; box-sizing: border-box; overflow: hidden; background: #0b0b0b; color: #ece6d6; font-family: 'Courier Prime', monospace">

  <div style="padding: 24px 16px; display: flex; flex-direction: column">
    <header style="display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 20px">
      <a href="Phone-List.dc.html" aria-label="KFED CAL calendar" style="text-decoration: none; color: inherit"><h1 style="margin: 0; font-family: 'Creepster', cursive; font-weight: 400; font-size: 64px; line-height: 1; letter-spacing: 0.02em; color: #ece6d6; text-shadow: 2px 2px 0 #ff3b3b">KFED CAL</h1></a>
      <a href="Status.dc.html" style="font-weight: 700; font-size: 12px; letter-spacing: 0.2em; color: #f4cdd5; text-decoration: underline; text-underline-offset: 4px">UPDATED WED OCT 28</a>
    </header>
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 8px; border-bottom: 2px solid #ece6d6">
      <span style="font-family: 'Pirata One', cursive; font-size: 40px; line-height: 1">October 30</span>
      <span style="font-weight: 700; font-size: 12px; letter-spacing: 0.2em; color: #f4cdd5">FRI · TONIGHT</span>
    </div>
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 25px; padding: 12px 0">The Tubs</span>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(11, 11, 11, 0.75)"></div>

  <section aria-label="Filters" style="position: absolute; left: 0; right: 0; bottom: 0; height: 820px; box-sizing: border-box; background: #141210; border-top: 2px solid #ece6d6; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h2 style="margin: 0; font-family: 'Pirata One', cursive; font-weight: 400; font-size: 36px; line-height: 1">Filters</h2>
      <a href="Phone-List.dc.html" style="display: flex; align-items: center; font-weight: 700; font-size: 13px; letter-spacing: 0.1em; color: #f4cdd5; text-decoration: none; height: 44px">CLOSE ×</a>
    </div>

    <label style="display: flex; flex-direction: column; gap: 8px; font-weight: 700; font-size: 12px; letter-spacing: 0.2em; color: #f4cdd5">SEARCH
      <input placeholder="band or night name" style="font-family: 'Courier Prime', monospace; font-size: 15px; letter-spacing: 0; background: transparent; color: #ece6d6; border: 0; border-bottom: 2px solid #ece6d6; padding: 8px 2px">
    </label>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-weight: 700; font-size: 12px; letter-spacing: 0.2em; color: #f4cdd5">WHEN</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button style="font-family: 'Courier Prime', monospace; font-weight: 700; font-size: 13px; letter-spacing: 0.1em; background: transparent; color: #ece6d6; border: 1px solid #b98e98; height: 44px; padding: 0 12px">TONIGHT</button>
        <button style="font-family: 'Courier Prime', monospace; font-weight: 700; font-size: 13px; letter-spacing: 0.1em; background: #b98e98; color: #0b0b0b; border: 1px solid #b98e98; height: 44px; padding: 0 12px">WEEKEND</button>
        <button style="font-family: 'Courier Prime', monospace; font-weight: 700; font-size: 13px; letter-spacing: 0.1em; background: transparent; color: #ece6d6; border: 1px solid #b98e98; height: 44px; padding: 0 12px">7 DAYS</button>
        <button style="font-family: 'Courier Prime', monospace; font-weight: 700; font-size: 13px; letter-spacing: 0.1em; background: transparent; color: #ece6d6; border: 1px solid #b98e98; height: 44px; padding: 0 12px">DATES…</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-weight: 700; font-size: 12px; letter-spacing: 0.2em; color: #f4cdd5">VENUES · 4 PICKED</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{venues}}" as="v" hint-placeholder-count="14">
          <button style="{{v.style}}">{{v.name}}</button>
        </sc-for>
      </div>
    </div>

    <label style="display: flex; align-items: center; justify-content: space-between; font-size: 15px; min-height: 44px">
      <span>Hide sold out</span>
      <input type="checkbox" style="width: 22px; height: 22px; accent-color: #ece6d6">
    </label>

    <button style="margin-top: auto; font-family: 'Courier Prime', monospace; font-weight: 700; font-size: 15px; letter-spacing: 0.1em; background: #ece6d6; color: #0b0b0b; border: 0; height: 52px">SHOW 13 SHOWS</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const picked = ['Zebulon', 'The Echo', 'Monty Bar', 'The Belasco'];
    const names = ['The Echo', 'Echoplex', 'Zebulon', 'Monty Bar', 'The Belasco', 'Lodge Room', 'Troubadour', 'The Roxy', 'El Cid', 'The Paramount', 'The Wiltern', 'The Fonda', '+ 9 MORE'];
    const base = "font-family: 'Courier Prime', monospace; font-weight: 700; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; height: 40px; padding: 0 10px; ";
    return {
      venues: names.map((name) => ({
        name,
        style: base + (picked.includes(name) ? 'background: #b98e98; color: #0b0b0b; border: 1px solid #b98e98;' : 'background: transparent; color: #ece6d6; border: 1px solid #b98e98;')
      }))
    };
  }
}
</script>
</body>
</html>
