<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KFED CAL — scrape status</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Creepster&amp;family=Pirata+One&amp;family=Courier+Prime:wght@400;700&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ece6d6}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 1280px; height: 1100px; box-sizing: border-box; overflow: hidden; background: #0b0b0b; color: #ece6d6; font-family: 'Courier Prime', monospace; padding: 40px; display: flex; flex-direction: column; gap: 24px">

  <header style="display: flex; flex-direction: column; align-items: center; gap: 6px">
    <a href="Main.dc.html" aria-label="KFED CAL calendar" style="text-decoration: none; color: inherit"><h1 style="margin: 0; font-family: 'Creepster', cursive; font-weight: 400; font-size: 120px; line-height: 1; letter-spacing: 0.02em; color: #ece6d6; text-shadow: 3px 2px 0 #ff3b3b">KFED CAL</h1></a>
    <a href="Status.dc.html" style="font-weight: 700; font-size: 12px; letter-spacing: 0.2em; color: #f4cdd5; text-decoration: underline; text-underline-offset: 4px">UPDATED WED OCT 28</a>
  </header>

  <div style="display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid #34302c; border-bottom: 2px solid #ece6d6; padding: 12px 0">
    <h2 style="margin: 0; font-family: 'Pirata One', cursive; font-weight: 400; font-size: 40px; line-height: 1">Scrape status</h2>
    <span style="font-size: 13px; color: #f4cdd5">RUN [WED, 2:13 AM PT] · NEXT [WED]</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
    <sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
      <div style="border: 1px solid #34302c; padding: 12px 16px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-weight: 700; font-size: 12px; letter-spacing: 0.2em; color: #f4cdd5">{{t.label}}</span>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 36px; line-height: 1.1">{{t.value}}</span>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column">
    <div style="display: grid; grid-template-columns: 200px 180px 150px 70px 110px 80px minmax(0, 1fr); gap: 16px; padding: 8px 0; border-bottom: 2px solid #ece6d6; font-weight: 700; font-size: 12px; letter-spacing: 0.15em; color: #f4cdd5">
      <span>VENUE</span><span>SOURCE</span><span>STATUS</span><span>SHOWS</span><span>THROUGH</span><span>W/ TIME</span><span>NOTES</span>
    </div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="21">
      <div style="display: grid; grid-template-columns: 200px 180px 150px 70px 110px 80px minmax(0, 1fr); gap: 16px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid #34302c; font-size: 14px">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px">{{r.v}}</span>
        <span style="color: #b98e98">{{r.src}}</span>
        <span><span style="{{r.chip}}">{{r.status}}</span></span>
        <span style="font-weight: 700">{{r.n}}</span>
        <span>{{r.thru}}</span>
        <span>{{r.time}}</span>
        <span style="color: #b98e98">{{r.note}}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const chip = {
      OK: 'font-weight: 700; font-size: 11px; letter-spacing: 0.12em; color: #ece6d6; border: 1px solid #ece6d6; padding: 1px 6px;',
      PARTIAL: 'font-weight: 700; font-size: 11px; letter-spacing: 0.12em; color: #0b0b0b; background: #b98e98; padding: 2px 6px;',
      'KEPT LAST WEEK': 'font-weight: 700; font-size: 11px; letter-spacing: 0.12em; color: #0b0b0b; background: #ff3b3b; padding: 2px 6px;',
      'NO SOURCE': 'font-weight: 700; font-size: 11px; letter-spacing: 0.12em; color: #b98e98; border: 1px dashed #b98e98; padding: 1px 6px;'
    };
    const rows = [
      ['The Echo', 'Ticketmaster', 'OK', '65', 'Apr 2027', '100%', ''],
      ['Echoplex', 'Ticketmaster', 'OK', '32', 'Apr 2027', '100%', ''],
      ['The Belasco', 'Ticketmaster', 'OK', '34', 'Apr 2027', '100%', ''],
      ['The Wiltern', 'Ticketmaster', 'OK', '89', 'Nov 2027', '100%', ''],
      ['Hollywood Palladium', 'Ticketmaster', 'OK', '45', 'May 2027', '100%', ''],
      ['The Bellwether', 'Ticketmaster', 'OK', '40', 'May 2027', '100%', "incl. Camille's"],
      ['Teragram Ballroom', 'Ticketmaster', 'OK', '44', 'May 2027', '100%', ''],
      ['The Regent', 'Ticketmaster', 'OK', '88', 'May 2028', '100%', ''],
      ['Greek Theatre', 'Ticketmaster', 'OK', '9', 'Sep 2027', '100%', ''],
      ['The Fonda', 'Ticketmaster', 'OK', '43', 'May 2027', '100%', ''],
      ['The Roxy', 'Ticketmaster', 'OK', '47', 'May 2027', '100%', ''],
      ['Troubadour', 'Ticketmaster', 'OK', '48', 'May 2027', '100%', ''],
      ['Hollywood Bowl', 'Bowl feed', 'OK', '14', 'Sep 2027', '0%', 'dates only'],
      ['Lodge Room', 'Tessera feed', 'OK', '71', '[month]', '[%]', ''],
      ['The Vermont', 'Events Calendar API', 'KEPT LAST WEEK', '11', 'Dec 2026', '[%]', 'example: blocked by bot check'],
      ['Zebulon', 'DICE', 'PARTIAL', '30', 'Nov 2026', '100%', 'DICE page caps at 30 (~3 weeks)'],
      ['The Paramount', 'DICE', 'OK', '[n]', '[month]', '100%', ''],
      ['Glass House', 'DICE', 'OK', '[n]', '[month]', '100%', ''],
      ['El Cid', 'Ticketmaster', 'PARTIAL', '3', 'Dec 2026', '100%', 'TM lists only some shows'],
      ['Permanent Records', 'venue site', 'OK', '[n]', '[month]', '100%', ''],
      ['Monty Bar', 'flyer + Haiku', 'OK', '5', 'this week', '100%', 'read by Haiku · $0.001'],
      ['Silverlake Lounge', '—', 'NO SOURCE', '0', '—', '—', 'waiting on mailing list']
    ];
    return {
      tiles: [
        { label: 'SHOWS', value: '[total]' },
        { label: 'VENUES OK', value: '18 / 22' },
        { label: 'NEEDS A LOOK', value: '4' },
        { label: 'HAIKU THIS RUN', value: '$0.001' }
      ],
      rows: rows.map(([v, src, status, n, thru, time, note]) => ({ v, src, status, n, thru, time, note, chip: chip[status] }))
    };
  }
}
</script>
</body>
</html>
