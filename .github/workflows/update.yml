name: Update calendar

on:
  schedule:
    - cron: "17 10 * * 3"  # 10:17 UTC Wednesdays = early Wednesday Pacific (3:17 AM PDT / 2:17 AM PST)
  workflow_dispatch:      # the "Run workflow" button on the Actions tab
  push:
    branches: [main]      # redeploy the site (without scraping) when code or venues change

permissions:
  contents: write  # to commit site/events.json
  issues: write    # to report venues that failed
  pages: write
  id-token: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check venues.json and run tests
        run: python -m scraper.venues && python -m unittest

      - name: Scrape venues
        if: github.event_name != 'push'
        run: python -m scraper.run
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit events.json, status.json and the artist cache
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add site/events.json
          if [ -f site/status.json ]; then git add site/status.json; fi
          if [ -f scraper/cache/artists.json ]; then git add scraper/cache/artists.json; fi
          git diff --cached --quiet || (git commit -m "Update events" && git push)

      # One open issue collects the failures: the first opens it, later ones add a comment. Close it once fixed.
      # "partial" is left out: some venues are partial every week.
      - name: Report venues that failed in an issue
        if: github.event_name != 'push'
        continue-on-error: true  # a problem here must not stop the deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          failed=$(jq -r '.venues[] | select(.status == "failed" or .status == "kept") | "- \(.name): `\(.note)`"' site/status.json)  # backticks: scraped text can't @mention anyone
          [ -z "$failed" ] && exit 0
          body=$(printf 'These venues failed in the scrape on %s:\n\n%s\n\nRun: %s/%s/actions/runs/%s' \
            "$(date -u +%F)" "$failed" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh label create scrape-failure --color d73a4a --description "A venue failed to scrape" --force
          issue=$(gh issue list --label scrape-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "Venues failed to scrape" --label scrape-failure --body "$body"
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The build copies site/events.json and site/status.json in next to the pages.
      - name: Build the site
        working-directory: web
        run: npm ci && npm run check && npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
      - id: deploy
        uses: actions/deploy-pages@v5
