name: Update calendar

on:
  schedule:
    - cron: "17 10 * * 3"  # 10:17 UTC Wednesdays = early Wednesday Pacific (3:17 AM PDT / 2:17 AM PST)
  workflow_dispatch:      # the "Run workflow" button on the Actions tab
  push:
    branches: [main]      # redeploy the site (without scraping) when code or venues change

permissions:
  contents: write  # to commit site/events.json
  pages: write
  id-token: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check venues.json and run tests
        run: python -m scraper.venues && python -m unittest

      - name: Scrape venues
        if: github.event_name != 'push'
        run: python -m scraper.run
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit events.json and status.json
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add site/events.json
          if [ -f site/status.json ]; then git add site/status.json; fi
          git diff --cached --quiet || (git commit -m "Update events" && git push)

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The build copies site/events.json and site/status.json in next to the pages.
      - name: Build the site
        working-directory: web
        run: npm ci && npm run check && npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist
      - id: deploy
        uses: actions/deploy-pages@v4
