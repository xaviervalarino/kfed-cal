name: Update calendar

on:
  schedule:
    - cron: "0 9 1 * *"  # 09:00 UTC on the 1st of every month
  workflow_dispatch:      # the "Run workflow" button on the Actions tab
  push:
    branches: [main]      # redeploy the site (without scraping) when code or venues change

permissions:
  contents: write  # to commit site/events.json
  pages: write
  id-token: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check venues.json
        run: python -m scraper.venues

      - name: Scrape venues
        if: github.event_name != 'push'
        run: python -m scraper.run

      - name: Commit events.json
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add site/events.json
          git diff --cached --quiet || (git commit -m "Update events" && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
